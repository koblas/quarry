name: verify

# The same check script sessions run, on every pull request.
#
# - verify: .claude/scripts/verify.sh against the pull request's base commit: go build, the full
#   covered test suite, the untested-diff check, go test -race, golangci-lint and test counts.
#   macOS, because quarry targets macOS 14+ and links DuckDB through cgo. Versions follow the
#   pins: Go from go.mod, golangci-lint matching devenv.
# - not-built: every `(not built: #N)` mark in docs/product/ names an OPEN issue. It runs on every
#   pull request, not only ones touching docs/product/: an issue closed elsewhere leaves its mark
#   wrong, and the next pull request is where that shows. The script is a vendored copy of the
#   pipeline plugin's (see its header).
# - commit-lint: every non-merge commit in the pull request has a Conventional Commits subject
#   (.claude/scripts/commit-lint.sh). Pull requests land as merge commits, so each commit
#   subject reaches main as written.

on:
  pull_request:

permissions:
  contents: read
  issues: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - name: verify.sh
        env:
          TMPDIR: ${{ runner.temp }}
        run: .claude/scripts/verify.sh "${{ github.event.pull_request.base.sha }}" ./...

  not-built:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Not-built marks match open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .claude/scripts/not-built.py

  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit subjects follow Conventional Commits
        run: .claude/scripts/commit-lint.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
