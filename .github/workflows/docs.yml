name: docs

# Builds the documentation site (mkdocs.yml, docs/) with Zensical on every pull
# request that touches it, failing on a broken link or anchor, and publishes
# main to GitHub Pages. The page checks against the code (go test ./docs
# ./internal/config) run in verify.yaml's full suite. The repository's Pages
# source must be "GitHub Actions" (Settings > Pages).

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "Makefile", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "Makefile", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make docs-build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
