# The user documentation, built by Zensical (https://zensical.org), which reads
# this MkDocs-format file, and published to GitHub Pages by
# .github/workflows/docs.yml. Build locally: make docs (or make docs-serve).
# docs/adr, docs/prior-art, docs/product, docs/security and docs/specs are
# internal design documents, kept in the repository only.
#
# The site follows the Divio documentation system (https://docs.divio.com/documentation-system/):
# Start here (tutorials), Concepts (explanation), Guides (how-to) and Reference.
# docs/guides/develop/docs.md says which quadrant a change belongs in;
# go test ./docs and go test ./internal/config check the reference pages against the code.
site_name: quarry
site_description: Your Quicken Classic for Mac data as a clean, local, queryable database.
site_url: https://koblas.github.io/quarry/
repo_url: https://github.com/koblas/quarry
repo_name: koblas/quarry
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: out/site
extra_css:
  - stylesheets/landing.css # the landing page only (docs/index.md)
exclude_docs: |
  adr/
  prior-art/
  product/
  security/
  specs/
  *_test.go

theme:
  name: material
  variant: modern
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - footnotes
  # Material's icon shortcodes (:material-…:) on the landing cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Start here:
      - index.md
      - Your first question: tutorials/first-question.md
  - Concepts:
      - concepts/index.md
      - Why quarry: concepts/why.md
      - How quarry works: concepts/how-quarry-works.md
      - How quarry counts money: concepts/counting-rules.md
      - Findings and the cleanup loop: concepts/findings.md
  - Guides:
      - guides/index.md
      - Ask:
          - How to use quarry with Claude: guides/use-with-claude.md
          - How to query the store with SQL: guides/query-with-sql.md
          - How to get a monthly summary: guides/monthly-summary.md
      - Maintain:
          - How to clean up your Quicken data: guides/clean-up-quicken.md
          - How to work out capital gains: guides/capital-gains.md
          - How to manage snapshots: guides/snapshots.md
          - How to configure quarry: guides/configure.md
      - Develop:
          - How to write documentation: guides/develop/docs.md
  - Reference:
      - reference/index.md
      - The CLI: reference/cli.md
      - MCP tools: reference/mcp-tools.md
      - config.toml: reference/config.md
